[package]
name = "aflos-integration"
version = "0.1.0"
license = "AGPL-3.0-or-later"
edition = "2024"
description = "The protocol between Aflos and its integrations (SPEC-integrations)"

[features]
# Running integrations (Aflos's side) and the echo stand-in and harness.
host = ["dep:tokio"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["process", "io-util", "sync", "time", "macros", "rt"], optional = true }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["process", "io-util", "sync", "time", "macros", "rt", "rt-multi-thread"] }

[[bin]]
name = "aflos-echo"
path = "src/bin/echo.rs"
required-features = ["host"]
