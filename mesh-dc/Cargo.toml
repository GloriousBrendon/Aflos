[package]
name = "mesh-dc"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace, like mesh-wa: songbird pins reqwest 0.12 / tungstenite 0.26,
# a second copy of each that Mesh itself never needs to build.
[workspace]

[dependencies]
songbird = { version = "0.6.1", default-features = false, features = ["driver", "gateway", "receive", "rustls", "tungstenite"] }
# songbird ships symphonia bare; the mic is raw f32 PCM, which needs this codec.
symphonia = { version = "0.5", default-features = false, features = ["pcm"] }
anyhow = "1"
async-channel = "2.5"
async-trait = "0.1"
base64 = "0.22"
cpal = "0.18"
env_logger = "0.11"
flate2 = "1"
futures-util = "0.3"
log = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ringbuf = "0.5"
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Discord video (design/DISCORD-VIDEO.md): the channel songbird's video sink
# uses, Mesh's H.264 decoder, and JPEGs for the V0 spike.
flume = "0.11"
# songbird logs with tracing: this sends its lines to our log too.
tracing = { version = "0.1", features = ["log"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
mesh-media = { path = "../mesh-media" }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# The exe's icon and version info (Task Manager shows "Mesh Discord").
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Discord video (design/DISCORD-VIDEO.md V1): songbird and its voice model,
# vendored to add video beside the audio path. Upstream: songbird 0.6.1,
# serenity-voice-model 0.3.0; changes are marked `mesh-dc:` in the source.
[patch.crates-io]
songbird = { path = "vendor/songbird" }
serenity-voice-model = { path = "vendor/serenity-voice-model" }
