# Builds the Windows setup and the Linux download, and publishes them as a
# GitHub Release when a v* tag is pushed. Run it by hand (Actions → release →
# Run workflow, or `gh workflow run release.yml --ref <branch>`) for a dry run:
# it builds everything and checks the release's files and SHA256SUMS, keeps
# them as the run's "release" artifact, and publishes nothing. mesh-node comes
# from the public Mesh-Node repo, at the tag matching Aflos's version (v0.4.1
# for Aflos 0.4.1): tag Mesh-Node first. No local checkout is involved.
#
# Every file is also published under Mesh's old name (Mesh-Setup-*.exe,
# mesh-*-linux-x86_64.tar.gz): Mesh 0.3.1's updater only looks for those.
# Drop the copies once nobody runs Mesh 0.3.1 any more.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { path: Aflos }
      - id: ver
        shell: bash
        run: echo "v=$(grep -m1 '^version' Aflos/crates/aflos/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: GloriousBrendon/Mesh-Node
          ref: v${{ steps.ver.outputs.v }}
          path: Mesh-Node
      - uses: dtolnay/rust-toolchain@stable
      - run: choco install innosetup -y --no-progress
      # build.ps1 is the same script as on your PC (SPEC-packaging P1).
      - run: Aflos\installer\build.ps1
        shell: pwsh
      - name: Copy under Mesh's old name, for Mesh 0.3.1's updater
        shell: pwsh
        run: |
          $setup = Get-ChildItem Aflos/dist/Aflos-Setup-*.exe | Select-Object -Last 1
          Copy-Item $setup.FullName (Join-Path $setup.DirectoryName ($setup.Name -replace '^Aflos-', 'Mesh-'))
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Aflos/dist/Aflos-Setup-*.exe
            Aflos/dist/Mesh-Setup-*.exe

  linux:
    # 24.04: 22.04's PipeWire is too old for libspa (aflos-wa, aflos-dc). The
    # binaries need a C library as new as 24.04's (glibc 2.39, distros from 2024 on).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { path: Aflos }
      - id: ver
        shell: bash
        run: echo "v=$(grep -m1 '^version' Aflos/crates/aflos/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: GloriousBrendon/Mesh-Node
          ref: v${{ steps.ver.outputs.v }}
          path: Mesh-Node
      - uses: dtolnay/rust-toolchain@stable
      - run: >
          sudo apt-get update && sudo apt-get install -y libasound2-dev
          libopus-dev libpipewire-0.3-dev libspa-0.2-dev clang pkg-config cmake
      - name: Build
        run: |
          (cd Aflos && cargo build --release -p aflos)
          (cd Aflos/aflos-wa && cargo build --release)
          (cd Aflos/aflos-dc && cargo build --release)
          (cd Mesh-Node && cargo build --release -p mesh-node)
      - name: Pack
        run: |
          v=$(grep -m1 '^version' Aflos/crates/aflos/Cargo.toml | cut -d'"' -f2)
          d=aflos-$v-linux-x86_64
          mkdir $d
          cp Aflos/target/release/aflos $d/aflos
          cp Aflos/aflos-wa/target/release/aflos-wa Aflos/aflos-dc/target/release/aflos-dc \
             Mesh-Node/target/release/mesh-node Aflos/installer/install-linux.sh \
             $d/
          cp -r Aflos/crates/aflos/assets/hicolor $d/
          tar czf $d.tar.gz $d
          # Mesh 0.3.1's updater runs <file name>/install-linux.sh: same files, old names.
          old=mesh-$v-linux-x86_64
          cp -r $d $old
          tar czf $old.tar.gz $old
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: "*-linux-x86_64.tar.gz"

  # Runs on a dry run too: the files and their SHA256SUMS are checked either
  # way; only a v* tag publishes them.
  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: Aflos
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Check the files and write SHA256SUMS
        run: |
          for pattern in 'Aflos-Setup-*.exe' 'aflos-*-linux-x86_64.tar.gz' 'Mesh-Setup-*.exe' 'mesh-*-linux-x86_64.tar.gz'; do
            n=$(compgen -G "$pattern" | wc -l)
            [ "$n" -eq 1 ] || { echo "::error::expected one $pattern, found $n"; ls -l; exit 1; }
          done
          cmp Aflos-Setup-*.exe Mesh-Setup-*.exe
          sha256sum Aflos-Setup-*.exe aflos-*.tar.gz Mesh-Setup-*.exe mesh-*.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          retention-days: 7
          path: |
            *.exe
            *.tar.gz
            SHA256SUMS
      # This version's CHANGELOG.md section heads the notes; a dry run checks
      # that it's there.
      - name: Write the release notes
        run: |
          v=$(compgen -G 'aflos-*-linux-x86_64.tar.gz' | sed 's/^aflos-//; s/-linux-x86_64\.tar\.gz$//')
          awk -v h="## $v" '$0 == h { f = 1; next } /^## / { f = 0 } f' Aflos/CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "::error::CHANGELOG.md has no ## $v section"; exit 1; }
          cat notes.md
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat >> notes.md <<'EOF'

          A beta for friends.

          **Windows:** run `Aflos-Setup-*.exe`. It isn't signed, so Windows shows
          "Windows protected your PC": click **More info**, then **Run anyway**.

          **Linux (x86-64):** unpack the `.tar.gz` and run `./install-linux.sh`.
          It installs into `~/.local/bin` with a menu entry, no root needed.
          It needs opus, ALSA and PipeWire, which desktop distros have.

          The `Mesh-Setup-*.exe` and `mesh-*.tar.gz` files are the same Aflos under
          Mesh's old name, so Mesh 0.3.1 can update itself. New installs: take the Aflos ones.

          Check your download against `SHA256SUMS`.
          EOF
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --prerelease \
            --title "Aflos $GITHUB_REF_NAME" --notes-file notes.md \
            Aflos-Setup-*.exe aflos-*.tar.gz Mesh-Setup-*.exe mesh-*.tar.gz SHA256SUMS
